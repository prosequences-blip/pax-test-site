<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather — Open-Meteo + Chart.js</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style> body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 860px; } select { padding: 0.4rem; margin-bottom: 1rem; } </style>
</head>
<body>
<h1>7-day forecast — major U.S. cities (Open-Meteo, no API key)</h1>
<label for="city">City:</label>
<select id="city"></select>
<p id="status">Loading forecast…</p>
<canvas id="chart" width="800" height="330"></canvas>
<script>
  // Major U.S. cities, per Jaeger's choice on 2026-10-30. Hillsboro is included
  // first because it is the map's single-location centre; it is a city centre
  // coordinate, not a street address.
  const CITIES = [
    { name: "Hillsboro, OR", lat: 45.5229, lon: -122.9898, tz: "America/Los_Angeles" },
    { name: "Portland, OR", lat: 45.5152, lon: -122.6784, tz: "America/Los_Angeles" },
    { name: "Seattle, WA", lat: 47.6062, lon: -122.3321, tz: "America/Los_Angeles" },
    { name: "San Francisco, CA", lat: 37.7749, lon: -122.4194, tz: "America/Los_Angeles" },
    { name: "Los Angeles, CA", lat: 34.0522, lon: -118.2437, tz: "America/Los_Angeles" },
    { name: "San Diego, CA", lat: 32.7157, lon: -117.1611, tz: "America/Los_Angeles" },
    { name: "Las Vegas, NV", lat: 36.1699, lon: -115.1398, tz: "America/Los_Angeles" },
    { name: "Phoenix, AZ", lat: 33.4484, lon: -112.0740, tz: "America/Phoenix" },
    { name: "Denver, CO", lat: 39.7392, lon: -104.9903, tz: "America/Denver" },
    { name: "Salt Lake City, UT", lat: 40.7608, lon: -111.8910, tz: "America/Denver" },
    { name: "Dallas, TX", lat: 32.7767, lon: -96.7970, tz: "America/Chicago" },
    { name: "Houston, TX", lat: 29.7604, lon: -95.3698, tz: "America/Chicago" },
    { name: "Austin, TX", lat: 30.2672, lon: -97.7431, tz: "America/Chicago" },
    { name: "San Antonio, TX", lat: 29.4241, lon: -98.4936, tz: "America/Chicago" },
    { name: "Chicago, IL", lat: 41.8781, lon: -87.6298, tz: "America/Chicago" },
    { name: "Minneapolis, MN", lat: 44.9778, lon: -93.2650, tz: "America/Chicago" },
    { name: "St. Louis, MO", lat: 38.6270, lon: -90.1994, tz: "America/Chicago" },
    { name: "Kansas City, MO", lat: 39.0997, lon: -94.5786, tz: "America/Chicago" },
    { name: "Nashville, TN", lat: 36.1627, lon: -86.7816, tz: "America/Chicago" },
    { name: "Atlanta, GA", lat: 33.7490, lon: -84.3880, tz: "America/New_York" },
    { name: "Miami, FL", lat: 25.7617, lon: -80.1918, tz: "America/New_York" },
    { name: "Jacksonville, FL", lat: 30.3322, lon: -81.6557, tz: "America/New_York" },
    { name: "New York, NY", lat: 40.7128, lon: -74.0060, tz: "America/New_York" },
    { name: "Philadelphia, PA", lat: 39.9526, lon: -75.1652, tz: "America/New_York" },
    { name: "Boston, MA", lat: 42.3601, lon: -71.0589, tz: "America/New_York" },
    { name: "Detroit, MI", lat: 42.3314, lon: -83.0458, tz: "America/Detroit" },
    { name: "Sacramento, CA", lat: 38.5816, lon: -121.4944, tz: "America/Los_Angeles" },
    { name: "Anchorage, AK", lat: 61.2181, lon: -149.9003, tz: "America/Anchorage" },
    { name: "Honolulu, HI", lat: 21.3099, lon: -157.8581, tz: "Pacific/Honolulu" }
  ];

  const select = document.getElementById("city");
  CITIES.forEach((city, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = city.name;
    select.appendChild(opt);
  });

  let chart = null;
  function loadWeather() {
    const city = CITIES[Number(select.value || 0)];
    const status = document.getElementById("status");
    status.textContent = "Loading forecast for " + city.name + "…";
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat + "&longitude=" + city.lon +
      "&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=" +
      encodeURIComponent(city.tz) + "&forecast_days=7";
    fetch(url).then(r => r.json()).then(data => {
      status.textContent = "Daily high / low (°F) — " + city.name;
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: { labels: data.daily.time, datasets: [
          { label: "High °F", data: data.daily.temperature_2m_max, borderColor: "#c0392b" },
          { label: "Low °F", data: data.daily.temperature_2m_min, borderColor: "#2471a3" }
        ]},
        options: { responsive: true }
      });
    }).catch(err => { status.textContent = "Could not load weather: " + err; });
  }
  select.addEventListener("change", loadWeather);
  loadWeather();
</script>
</body>
</html>
